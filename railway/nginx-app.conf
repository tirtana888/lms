server {
    listen 8080;
    # Railway reaches a container over IPv6; "listen 8080" alone binds 0.0.0.0
    # only, so the edge cannot open a connection at all - it reports the domain
    # as not existing (x-railway-fallback: true) or 502s, while nginx, gunicorn
    # and every worker are up and healthy inside the container. Older Railway
    # runtimes still reached us over IPv4, which is why this only surfaced once
    # services started landing on the newer runtime: first every newly added
    # domain, then the original one too after a redeploy rescheduled it.
    listen [::]:8080;
    server_name _;
    root /home/frappe/frappe-bench/sites;

    client_max_body_size 50m;

    location /assets {
        try_files $uri =404;
    }

    # Public uploads (brand logo, favicon, anything uploaded with private=0).
    # Frappe itself has no fallback handler for these — /private/files/ gets a
    # dedicated Python route (app.py's download_private_file, permission-
    # checked), but plain /files/ is normally served by nginx directly off
    # disk in every stock frappe_docker config and Python is never involved.
    # Without this block those requests fell through to location / (gunicorn),
    # whose website router has no renderer for sites/<site>/public/files/ at
    # all — StaticPage only looks under apps/<app>/www/ — so every public
    # upload 404'd, filenames with spaces included, regardless of filename.
    # Substituted from $SITE_NAME by entrypoint.sh, NOT $host: the site folder
    # only happened to equal the hostname because the site was created from the
    # Railway domain. The moment a second domain points here, $host names a
    # folder that does not hold this site's uploads, and every image - login
    # logo, avatars, quiz media - 404s on that domain alone while working on
    # the original one.
    location /files {
        try_files /__FRAPPE_SITE_NAME__/public$uri =404;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Deliberately no direct-disk rule for /scorm — every SCORM request goes
    # through gunicorn below so the Python permission gate always runs.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The one site this container serves, substituted from $SITE_NAME by
        # entrypoint.sh - NOT $host. Frappe is multi-tenant and treats this
        # header as "which site is this request for", so with $host every new
        # domain pointed here asked for a site named after that domain: the
        # site does not exist, and a boot with SITE_NAME set to the new domain
        # made bench new-site create an empty one, which then answered on that
        # domain looking like a fresh install while the real site (with every
        # student, its branding and SSO) kept answering only on its original
        # hostname. The site's folder name is an internal identity; it has no
        # reason to match the domains it is reachable at.
        proxy_set_header X-Frappe-Site-Name __FRAPPE_SITE_NAME__;
        proxy_read_timeout 300;
    }
}
