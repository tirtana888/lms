[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
# 17 workers, not 2: gunicorn's default sync worker serves ONE request at a time,
# so `--workers 2` capped the whole app at two concurrent requests. That is far
# below what this container has (8 vCPU / 8 GB per cgroup) and it is what broke
# SCORM for students - a single SCORM lesson is 100-120 separate file requests
# (every JS chunk, font, image and content fragment), all of which must pass
# through Python because /scorm deliberately has no direct-disk rule in nginx.
# The queue was visible in the HTTP logs as a latency ramp inside one burst
# (530ms climbing to 671ms, and 1073ms in an earlier one) until the package's
# own player gave up and showed its "connection lost" screen.
# 17 = the usual (2 x CPU) + 1. Measured cost per worker here is ~130 MB, so
# this lands near 2.9 GB of the 8 GB - there is room to raise it further if the
# numbers say so. Sync workers deliberately, not `--worker-class gthread`:
# memory is not the constraint, so threads would buy concurrency only at the
# price of assuming every code path in Frappe and this fork is thread-safe,
# which is not something to assume in an app holding student records.
command=/home/frappe/frappe-bench/env/bin/gunicorn --bind 0.0.0.0:8000 --workers 17 --timeout 120 frappe.app:application
directory=/home/frappe/frappe-bench/sites
user=frappe
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socketio]
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench/sites
user=frappe
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-short]
command=/usr/local/bin/bench worker --queue short,default
directory=/home/frappe/frappe-bench
user=frappe
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-long]
command=/usr/local/bin/bench worker --queue long
directory=/home/frappe/frappe-bench
user=frappe
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/bench schedule
directory=/home/frappe/frappe-bench
user=frappe
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
