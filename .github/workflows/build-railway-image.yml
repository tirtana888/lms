name: Build Railway image

on:
  push:
    branches: [develop]
    paths:
      - "railway/**"
      - ".github/workflows/build-railway-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lms (this repo)
        uses: actions/checkout@v4
        with:
          path: lms

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bench image (frappe + payments + lms)
        uses: docker/build-push-action@v5
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lms-bench:latest
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
            PYTHON_VERSION=3.11.6
            NODE_VERSION=24
          secret-files: |
            apps_json=lms/railway/apps.json

      - name: Build Railway app image (nginx + supervisord wrapper)
        uses: docker/build-push-action@v5
        with:
          context: lms
          file: lms/railway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lms-railway:latest
